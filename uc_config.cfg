[topology_config]
numhosts = 15
numswitchs = 10
portspeed = 1000
procdelay = 40
propdelay = 10
linkBw = 1000
queuecountperport = 6
graphConfig = {"typ":'ft', "k":4}
# graphConfig = {typ:'er', 'prob':0.3, 'numcoreswitches': 3, 'minnodedegreepersw': 3}
# graphConfig = {typ:'ba', 'numEdgN':3, 'numcoreswitches': 3, 'minnodedegreepersw': 3}

[streams_config]
numofstreamsperinstance = 5
maxstrpernode = 100
period_range = {"start":100,"stop":300, "step":200}
numberframes_range = {"start":1,"stop":3}
datasize_range = {"start":64,"stop":256} # 2000
maxlatency_range = 10 # 0.5,1,2,5,10
numplacestalker = 1
numplaceslistener = 1
numlistenersperstr = 1
routing = {'fixPath': True, 'shortestPath':True} # if not shortest path then it is randomPath, numTalkers has to be 1
stride = {'active': False,'step':5, 'increase_factor':50} # for 'ft' graph, step = k+1
staggered = {'active': False,'edgep': 0.74, 'podp':0.25}
hotspot = {'active': False, 'increase_factor':10}
expiration = {'finite_duration':True, "start":5,"stop":20} # mins
generation = {'incremental': False} # if true then multiple usecase are generated with the same topology but each time a new stream is added to the already existing ones